# 修仙挂机 —— 一键部署
#
#   cd deploy
#   cp .env.example .env      # 然后把 .env 里的域名和密码填上
#   docker compose up -d
#
# 两个服务：
#   game  —— 游戏本体（Fastify + Socket.IO + 前端静态文件），只在内网监听
#   caddy —— 唯一对外的入口，自动申请并续期 HTTPS 证书，反代给 game
#
# game 不发布任何端口到宿主机：所有流量都必须过 caddy，
# 这样「http 也能进」这种口子从一开始就不存在。

name: xianxia

services:
  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: xianxia:latest
    restart: unless-stopped
    # Node 当 PID 1 时拿不到默认信号处理；init 进程负责转发并回收僵尸进程。
    init: true
    environment:
      # 后台密码，必填。缺了进程会直接退出。
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请先在 .env 里设置 ADMIN_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # 首次启动写入的无限次邀请码。留空则不写。
      INVITE_CODE: ${INVITE_CODE:-}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 下面这些镜像里已有默认值，列出来是为了让人一眼看全。
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      # 存档就在这里。删掉这个卷 = 删掉整个服务器的角色数据。
      - game-data:/data
    expose:
      - '3000'

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      game:
        condition: service_healthy
    environment:
      # Caddyfile 里的 {$DOMAIN}。填域名 = 自动 HTTPS；填 :80 = 只开 HTTP。
      DOMAIN: ${DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      # 左边是宿主机端口，右边固定是容器内的 80/443，不要改右边。
      # 申请证书需要 80 和 443 都能从公网直达。
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      # HTTP/3（QUIC）走 UDP，可选，但开着更快。
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书和账号密钥。丢了会重新申请，短时间内反复重申会撞 Let's Encrypt 限额。
      - caddy-data:/data
      - caddy-config:/config

volumes:
  game-data:
  caddy-data:
  caddy-config:
