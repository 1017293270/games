packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'
  - 'e2e'
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - eslint@10.10.0
  - '@playwright/test@1.63.0'
  - playwright-core@1.63.0
  - playwright@1.63.0
  - fastify@5.12.3
onlyBuiltDependencies:
  - esbuild
strictPeerDependencies: false
